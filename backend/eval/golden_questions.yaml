# golden_questions.yaml — the labeled test set for eval/run_eval.py
#
# HOW TO ADD MORE QUESTIONS:
#   1. Ingest your PDFs first (`uv run ingest.py`) if you haven't already.
#   2. Open a PDF, find a fact you can point at a specific page, and write a
#      plain-English question a real employee might ask for it.
#   3. Aim for roughly 8 in_scope questions (spread across your different
#      documents, not just one) and 3 out_of_scope questions -- include at
#      least one "near miss" out_of_scope question (plausible-sounding, maybe
#      even mentioning a real company/document name, but not actually
#      answerable from your docs) to check the system doesn't just latch onto
#      a keyword match and hallucinate.
#
# SCHEMA (one YAML mapping per question):
#   id:              unique short string, e.g. "q1"
#   question:        plain-English question to ask the RAG system
#   type:             "in_scope" | "out_of_scope"
#   expected_source:  filename of the PDF that actually answers it (in_scope only)
#   expected_pages:   list of page numbers where the answer lives (in_scope only)
#                     -- any one of these pages counts as a hit; list more than
#                     one if the fact legitimately appears on multiple pages
#                     (e.g. once in prose, once in a table).
#   key_facts:        list of short facts the answer MUST contain (in_scope
#                     only) -- used by the --judge answer-correctness check.
#
# out_of_scope items only need id/question/type -- omit expected_source,
# expected_pages, and key_facts entirely for those.
#
# This set is built against Calfus's real internal policy library in
# data/pdfs/ -- it replaces an earlier version built against three fictional
# sample HR handbooks (Cedar Valley, Harborlight, Northstar Ridge). Those got
# deleted from the live library once real documents were uploaded (they were
# only ever placeholder/test content, mixed into the same searchable corpus
# as the real policies and actively causing wrong answers -- a company-
# unspecified WFH question would retrieve a fictional company's policy ahead
# of the real one). If you ever swap in a different document set again,
# replace these questions with ones grounded in whatever's actually live.
#
# q9 and q10 are deliberately NOT simple lookups -- they're the same
# reasoning classes that were found broken in production and fixed in
# retrieval/prompt.py (grounding rule 10: comparisons against a stated
# limit; rule 7's addition: a scenario against a policy's stated scope). Both
# classes were previously untested, which is exactly how they shipped
# broken -- q10 is the literal real question ("will my travel expenses be
# covered if I travel for personal reasons") that surfaced the scope bug.

# -- Background Verification -------------------------------------------

- id: q1
  question: "How many days after joining does a new hire have to complete Background Verification, and how many extra days does HR allow if it's delayed?"
  type: in_scope
  expected_source: "BGV Policy_Ver1.0.pdf"
  expected_pages: [2, 3]
  key_facts:
    - "Must be completed within 60 days of the date of joining"
    - "HR allows 15 more days to get the checks cleared if delayed"

# -- Employee Referral ----------------------------------------------------

- id: q2
  question: "What is the referral bonus for a candidate with 6 to 8 years of experience, and how should the referral be submitted?"
  type: in_scope
  expected_source: "Calfus Crew - Employee Referral Policy_1.2.pdf"
  expected_pages: [3]
  key_facts:
    - "INR 70,000 referral bonus for 6-8 years of experience"
    - "Submitted via email to employee.referral@calfus.com with the candidate's details"

# -- Confirmation (probation) -----------------------------------------------

- id: q3
  question: "Who issues the confirmation letter when probation performance is satisfactory, and what happens if performance is below expectations?"
  type: in_scope
  expected_source: "Confirmation Policy_Ver1.0.pdf"
  expected_pages: [2]
  key_facts:
    - "HR issues a Confirmation Letter to the employee"
    - "Probation may be extended and a probation extension letter is issued"

# -- Domestic Travel --------------------------------------------------------

- id: q4
  question: "What is the meal reimbursement rate for lunch during business travel, and how many days in advance must the travel desk be informed?"
  type: in_scope
  expected_source: "Travel Policy_Ver1.0.pdf"
  expected_pages: [3]
  key_facts:
    - "Rs. 300 for lunch/dinner"
    - "Travel desk informed at least 15 days in advance"

# -- India Relocation --------------------------------------------------------

- id: q5
  question: "How many days of guest house accommodation do relocating employees get, and what's the maximum reimbursement for transporting goods?"
  type: in_scope
  expected_source: "India Relocation Policy Ver1.0.pdf"
  expected_pages: [2]
  key_facts:
    - "10 days of accommodation"
    - "Maximum of INR 75,000 for transportation of goods"

# -- Rewards and Recognition --------------------------------------------------

- id: q6
  question: "How many days before Calfus Connect must a Virtues in Action nomination be submitted, and who approves exceptions to this policy?"
  type: in_scope
  expected_source: "Rewards and Recognition Policy_Ver1.0.pdf"
  expected_pages: [2]
  key_facts:
    - "Nominated 7 days before Calfus Connect"
    - "Exceptions require prior written approval from the India Head, in consultation with HR"

# -- Certification Reimbursement ---------------------------------------------

- id: q7
  question: "What is the approval workflow for a certification reimbursement request, and when must the request be submitted?"
  type: in_scope
  expected_source: "Certification Reimbursement Policy_Ver1.0.pdf"
  expected_pages: [3]
  key_facts:
    - "Approval workflow is Reporting Manager, then Functional Head, then HRBP"
    - "Must be submitted prior to certification enrolment"

# -- Disciplinary -------------------------------------------------------------

- id: q8
  question: "Who should Information Security Violations be escalated to, and what is the first recommended disciplinary action?"
  type: in_scope
  expected_source: "Disciplinary Policy_Ver1.0.pdf"
  expected_pages: [2, 4]
  key_facts:
    - "Escalated directly to the CISO"
    - "Verbal warning is the first recommended disciplinary action"

# -- Reasoning: comparison against a stated limit ------------------------

- id: q9
  question: "Can a relocating employee stay in the company guest house for 15 days without approval?"
  type: in_scope
  expected_source: "India Relocation Policy Ver1.0.pdf"
  expected_pages: [2]
  key_facts:
    - "Guest house accommodation is provided for 10 days"
    - "Any extension beyond 10 days needs prior approval from the India Head"

# -- Reasoning: scenario against a policy's stated scope ------------------

- id: q10
  question: "Will my personal travel expenses be reimbursed under the Travel Policy?"
  type: in_scope
  expected_source: "Travel Policy_Ver1.0.pdf"
  expected_pages: [3]
  key_facts:
    - "Personal expenses incurred during travel are not reimbursable"

# -- Out of scope ----------------------------------------------------------

- id: q11
  question: "What's the weather forecast for tomorrow?"
  type: out_of_scope

- id: q12
  question: "What is Calfus Technologies' stock ticker symbol?"
  type: out_of_scope
  # "Near miss": a real company name from the library, but none of the
  # policies cover stock/investor information -- checks that retrieval
  # doesn't hallucinate just because the company name matched.

- id: q13
  question: "What is the employer's 401(k) matching percentage?"
  type: out_of_scope
  # "Near miss": a very ordinary benefits topic an employee might assume is
  # covered, but this is an India-based policy library (401(k) is a US
  # retirement plan) -- none of the documents mention it.
