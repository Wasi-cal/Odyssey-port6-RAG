# -- Advisory: goal-oriented leave planning --------------------------------
#
# All three cases below are grounded in the real Leave Policy table
# (Calfus India Employee Handbook v4.pdf, section 5.3 "Leave Policy", p.13):
#   Earned Leave 21 days (encash max 10, carry-forward max 10 unutilized)
#   Sick Leave 7 days (no encash/carry-forward)
#   Marriage Leave 2 days (no encash/carry-forward)
#   Bereavement Leave 2 days, Paternity Leave 10 days, Birthday Leave 1 day,
#   Maternity Leave up to 180 days (as per act)
# Only Earned Leave is usable for a generic "I want days off" goal with no
# stated qualifying reason -- every other leave type in that table requires
# a specific triggering circumstance (illness, marriage, bereavement, etc.)
# that must actually be present in the employee's stated goal to be a
# legitimate bucket for it.

- id: advisory_feasible_01
  question: "I'm getting married next month and want to take 12 days off -- some for the wedding itself and the rest just to unwind afterward."
  type: advisory
  expected_sources: ["Calfus India Employee Handbook v4.pdf", 13]
  buckets:
    marriage_leave: "2 days"
    earned_leave: "21 days"
  feasible: true
  expected_total: 12
  expected_buckets: ["marriage_leave", "earned_leave"]
  notes: "Marriage Leave (2 days, for the wedding itself -- its stated purpose) plus 10 of the
    employee's 21 annual Earned Leave days (general-purpose, no reason required) covers the
    12-day goal without exceeding either bucket's stated limit, and each bucket is used for a
    purpose the context actually supports (2 + 10 = 12). Expect both buckets cited."

- id: advisory_infeasible_01
  question: "I want to take 40 days off"
  type: advisory
  expected_sources: ["Calfus India Employee Handbook v4.pdf", 13]
  buckets:
    earned_leave: "21 days"
    sick_leave: "7 days -- for illness only; not applicable, no illness stated in this goal"
    marriage_leave: "2 days -- not applicable, no stated qualifying event"
    bereavement_leave: "2 days -- not applicable, no stated qualifying event"
    paternity_leave: "10 days -- not applicable, no stated qualifying event"
    birthday_leave: "1 day"
    lop_lwp: "no numeric limit; conditional, situation warrants, see advisory_misuse_temptation_01 note"
  feasible: false
  expected_total: 22
  expected_buckets: ["earned_leave", "birthday_leave"]
  notes: "A CORRECT answer's stated in-policy maximum must be built only from purpose-matched,
    unconditional buckets (Earned Leave 21 + Birthday Leave 1 = 22 days guaranteed maximum);
    Sick/Marriage/Bereavement/Paternity must NOT appear in the sum since none of their
    qualifying purposes are stated for this goal. LOP/LWP may be named as a possible path for
    further days but must be flagged as conditional, not summed as guaranteed. Expect an honest
    infeasibility statement, the 22-day in-policy maximum cited, and an escalation offer
    (manager or exception request)."

- id: advisory_misuse_temptation_01
  question: "I want 20 days off, I only have 15 earned leave days left and I'm not sick"
  type: advisory
  expected_sources: ["Calfus India Employee Handbook v4.pdf", 13]
  buckets:
    earned_leave: "21 days annual entitlement per policy; employee states 15 days remaining in this scenario"
    sick_leave: "7 days -- for illness only; explicitly off-purpose here since the employee states they are not sick"
    lop_lwp: "no numeric limit stated; policy: 'if employee doesn't have any leave to their
      balance and the situation warrants them to take the leave, the leave will be granted
      as loss of pay (LOP) or leave without pay (LWP)' -- conditional/discretionary, no
      named approver, gated on undefined 'situation warrants' clause, p.13"
  feasible: false
  expected_total: 15
  expected_buckets: ["earned_leave"]
  notes: "A CORRECT answer states the 15 guaranteed Earned Leave days separately from the
    possibility of LOP/LWP for the remaining 5, names the 'situation warrants' condition
    explicitly rather than presenting LOP/LWP as automatic or guaranteed, and does not include
    Sick Leave anywhere in the answer since the employee stated they are not sick. Expect the
    legitimate maximum (15 remaining Earned Leave days) stated, escalation offered, and NO
    suggestion of sick leave or any off-purpose bucket use. This is the case most likely to catch
    a grounding regression -- treat any misuse suggestion here as an automatic fail."

# -- Coverage-gap additions (d1-d28) -----------------------------------------
#
# Added from a full-corpus coverage-gap pass (see eval_coverage_gap_report.md
# in project scratch notes) targeting categories the original q1-q13 set
# didn't exercise: MULTI-PART, COMPARATIVE, CROSS-DOCUMENT, TABLE-DEPENDENT,
# and NEAR-DUPLICATE DISAMBIGUATION (the last added after q6 and q2 both
# independently reproduced the same near-identical-source-competing-for-
# retrieval failure mode in production). Every fact below was hand-verified
# against the actual PDF text, including HR Security Policy page numbers
# re-derived from this pipeline's own extract_pages() output rather than the
# PDF's printed footer or a raw page-reader index, which disagree with each
# other and with what's actually stored in Chroma metadata for this document.

