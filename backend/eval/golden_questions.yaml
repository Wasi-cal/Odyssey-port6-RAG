# -- NEAR-DUPLICATE DISAMBIGUATION ---------------------------------------------
# These target the confirmed, twice-reproduced production failure mode where
# near-identical "Exception to Policy" wording across many documents (or
# near-identical content across the two Referral Policy PDFs) makes it hard
# for embedding retrieval to land on the ONE correct source. Each question
# below names its specific policy explicitly so there is exactly one correct
# ground truth, even though a near-identical sentence exists elsewhere.

