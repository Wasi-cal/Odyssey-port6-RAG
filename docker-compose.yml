services:
  # --- App data (chat history + document library, keyed by user_id) ------
  app-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=docassist
      - POSTGRES_PASSWORD=docassist
      - POSTGRES_DB=docassist
    ports:
      # Host 5432 is already taken by a local Postgres on this machine (see
      # `lsof -iTCP:5432`) -- published on 5433 instead, for pgAdmin4 or psql
      # from the host. Containers on the compose network still reach it as
      # app-db:5432 (see DATABASE_URL below), unaffected by this mapping.
      - "5433:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docassist"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Live config cache (assistant/config_store.py) ----------------------
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Temporal (durable, per-file-retryable ingestion workflow) ---------
  temporal-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    depends_on:
      temporal-db:
        condition: service_healthy
    ports:
      - "7233:7233"
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8080:8080"
    depends_on:
      - temporal
    restart: unless-stopped

  worker:
    build: ./backend
    command: python worker.py
    env_file:
      - ./backend/.env
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    volumes:
      - ./backend/data:/app/data
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/reports:/app/reports
    depends_on:
      - temporal
    restart: unless-stopped

  # --- App ----------------------------------------------------------------
  api:
    build: ./backend
    # --proxy-headers: trust the X-Forwarded-For Caddy sets on every
    # request it proxies, so request.client.host (used by
    # assistant/rate_limit.py's per-IP login lockout) reflects the real
    # browser's IP, not Caddy's own docker-network address. Safe to trust
    # unconditionally here -- api's only inbound path is through Caddy on
    # this same private compose network, not the public internet.
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    env_file:
      - ./backend/.env
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DATABASE_URL=postgresql://docassist:docassist@app-db:5432/docassist
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/reports:/app/reports
    depends_on:
      temporal:
        condition: service_started
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Next.js chat UI + /admin dashboard, ONE app/container now (see
  # frontend/app/admin/page.tsx) -- replaces the old two-Streamlit-app split
  # (ui + admin-ui). BACKEND_URL feeds next.config.mjs's /api/* rewrite, so
  # both the chat flow and the admin dashboard reach the API through the
  # same same-origin proxy, no CORS config needed either side.
  ui:
    build:
      context: ./frontend
      # Must match at build time too -- next.config.mjs's rewrite
      # destination is baked in by `next build`, not re-read at `next
      # start` (see frontend/Dockerfile's comment on this ARG).
      args:
        - BACKEND_URL=http://api:8000
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # --- TLS termination -----------------------------------------------------
  # Fronts ui and api on the SAME ports they'd otherwise publish directly
  # (8501, 8000) -- now over HTTPS instead of plain HTTP. Neither publishes
  # its port itself anymore (see `expose` above); this is the only way in
  # from the host. /admin now lives inside ui (frontend/app/admin/page.tsx),
  # so there's no separate admin-ui port anymore -- reach it at
  # https://localhost:8501/admin.
  caddy:
    image: caddy:2-alpine
    ports:
      - "8501:8501"
      - "8000:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_started
    restart: unless-stopped

volumes:
  temporal-db-data:
  app-db-data:
  caddy-data:
  caddy-config:
