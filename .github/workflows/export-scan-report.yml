name: Export scan report to S3

# Calls Gozurion's reusable scan-export workflow to scan this repo with
# semgrep + trivy and upload the findings to S3. See:
# https://github.com/Prakrit-Mohanty/Gozurion/blob/main/.github/workflows/export-sonar-report.yml
#
# Runs on every push to main, plus manually via Actions -> Export scan
# report to S3 -> Run workflow.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   S3_ACCESS_KEY_ID
#   S3_SECRET_ACCESS_KEY
#   S3_BUCKET
# Optional:
#   S3_ENDPOINT_URL   (blank = real AWS S3; set for MinIO)
#
# To also run SonarQube, add "sonarqube" to enabled_scanners below and
# add SONAR_URL / SONAR_TOKEN secrets.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      enabled_scanners:
        description: "Comma-separated scanners to run: semgrep, trivy, sonarqube"
        required: false
        type: string
        default: semgrep,trivy

jobs:
  export-scan-report:
    uses: Prakrit-Mohanty/Gozurion/.github/workflows/export-sonar-report.yml@main
    with:
      enabled_scanners: ${{ inputs.enabled_scanners || 'semgrep,trivy' }}
    secrets:
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
