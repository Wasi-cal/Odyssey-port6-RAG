name: Export scan report to S3

# Calls Gozurion's reusable scan-export workflow, which scans this repo
# with SonarQube and uploads the findings to S3. See:
# https://github.com/Prakrit-Mohanty/Gozurion/blob/main/.github/workflows/export-sonar-report.yml
#
# Runs on every push to main, plus manually via Actions -> Export scan
# report to S3 -> Run workflow.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SONAR_URL
#   SONAR_TOKEN
#   S3_ACCESS_KEY_ID
#   S3_SECRET_ACCESS_KEY
#   S3_BUCKET
# Optional:
#   S3_ENDPOINT_URL           (blank = real AWS S3; set for MinIO)
#   GOZURION_CHECKOUT_TOKEN   (only needed if Gozurion is private and cross-org)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sonar_project_key:
        description: "SonarQube project key - defaults to this repo's name"
        required: false
        type: string
      gozurion_ref:
        description: "Branch/tag of Gozurion to install the exporter from"
        required: false
        type: string
        default: main

jobs:
  export-scan-report:
    uses: Prakrit-Mohanty/Gozurion/.github/workflows/export-sonar-report.yml@main
    with:
      sonar_project_key: ${{ inputs.sonar_project_key }}
      gozurion_ref: ${{ inputs.gozurion_ref || 'main' }}
    secrets:
      SONAR_URL: ${{ secrets.SONAR_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      GOZURION_CHECKOUT_TOKEN: ${{ secrets.GOZURION_CHECKOUT_TOKEN }}
