name: Export scan report to S3

# Scans this repo with semgrep + trivy and uploads the JSON findings to S3.
#
# Runs on every push to main, plus manually via Actions -> Export scan
# report to S3 -> Run workflow.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   S3_ACCESS_KEY_ID
#   S3_SECRET_ACCESS_KEY
#   S3_BUCKET
# Optional:
#   S3_ENDPOINT_URL   (blank = real AWS S3; set for MinIO)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  export-scan-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: pip install semgrep

      - name: Run semgrep
        run: semgrep scan --config auto --json --output semgrep-results.json .
        continue-on-error: true

      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run trivy
        run: trivy fs --format json --output trivy-results.json .
        continue-on-error: true

      - name: Upload reports to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT_ARGS=()
          if [ -n "${S3_ENDPOINT_URL:-}" ]; then
            ENDPOINT_ARGS=(--endpoint-url "$S3_ENDPOINT_URL")
          fi
          DEST="s3://${S3_BUCKET}/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          aws s3 cp semgrep-results.json "${DEST}/semgrep-results.json" "${ENDPOINT_ARGS[@]}"
          aws s3 cp trivy-results.json "${DEST}/trivy-results.json" "${ENDPOINT_ARGS[@]}"
