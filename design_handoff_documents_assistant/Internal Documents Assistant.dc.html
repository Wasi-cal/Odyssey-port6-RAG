<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #FFFFFF; }
    * { box-sizing: border-box; }
    ::selection { background: #E4E7FF; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #E7E9F0; border-radius: 8px; }
    textarea::placeholder { color: #A6ABBA; }
  </style>
</helmet>

<div style="display:flex; height:100vh; width:100%; font-family:'IBM Plex Sans',sans-serif; background:#fff; color:#1A2036; overflow:hidden;">

  <!-- Sidebar -->
  <aside style="width:{{ sidebarWidth }}; min-width:{{ sidebarWidth }}; background:#FBFBFC; border-right:1px solid #EEEFF3; display:flex; flex-direction:column; overflow:hidden; transition:width .18s ease, min-width .18s ease;">
    <div style="width:264px; padding:22px 18px; display:flex; flex-direction:column; gap:22px; height:100%; overflow-y:auto;">

      <div style="display:flex; align-items:center; gap:9px;">
        <div style="width:26px; height:26px; border-radius:7px; background:#171B2E; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 2h9l5 5v15a1 1 0 01-1 1H6a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
        </div>
        <span style="font-family:'Manrope',sans-serif; font-weight:700; font-size:14px; letter-spacing:-0.01em;">Doc Assist</span>
      </div>

      <div style="flex:1; display:flex; flex-direction:column; gap:4px; min-height:0; overflow-y:auto;">

        <div>
          <button onClick="{{ onToggleLibrarySection }}" style="width:100%; display:flex; align-items:center; justify-content:space-between; padding:8px 4px; background:none; border:none; cursor:pointer;">
            <span style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:#B4B8C4;">Library</span>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" style="transform:{{ libraryChevron }}; transition:transform .15s ease;"><path d="M6 9l6 6 6-6" stroke="#B4B8C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <sc-if value="{{ librarySectionOpen }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex; flex-direction:column; gap:6px; padding-bottom:6px;">
              <sc-if value="{{ isIngesting }}">
                <div style="display:flex; align-items:center; gap:7px; padding:6px 8px; font-size:12px; color:#9297A6;">
                  <span style="width:11px; height:11px; border-radius:50%; border:2px solid #E0E2EA; border-top-color:#4338CA; animation:spin .7s linear infinite; display:inline-block;"></span>
                  Ingesting…
                </div>
              </sc-if>
              <sc-if value="{{ hasDocs }}" hint-placeholder-val="{{ false }}">
                <sc-for list="{{ docs }}" as="d" hint-placeholder-count="2">
                  <div style="display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:8px;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;"><path d="M6 2h9l5 5v15a1 1 0 01-1 1H6a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="#B4B8C4" stroke-width="2"/></svg>
                    <div style="min-width:0; flex:1;">
                      <div style="font-size:12.5px; font-weight:500; color:#3C4258; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ d.name }}</div>
                    </div>
                  </div>
                </sc-for>
              </sc-if>
              <sc-if value="{{ hasNoDocs }}" hint-placeholder-val="{{ true }}">
                <div style="font-size:12px; color:#B4B8C4; padding:4px 8px; line-height:1.6;">No documents yet.</div>
              </sc-if>
            </div>
          </sc-if>
        </div>

        <div>
          <button onClick="{{ onToggleHistorySection }}" style="width:100%; display:flex; align-items:center; justify-content:space-between; padding:8px 4px; background:none; border:none; cursor:pointer;">
            <span style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:#B4B8C4;">Chat History</span>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" style="transform:{{ historyChevron }}; transition:transform .15s ease;"><path d="M6 9l6 6 6-6" stroke="#B4B8C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <sc-if value="{{ historySectionOpen }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex; flex-direction:column; gap:2px; padding-bottom:6px;">
              <sc-if value="{{ hasHistory }}" hint-placeholder-val="{{ false }}">
                <sc-for list="{{ history }}" as="h" hint-placeholder-count="2">
                  <button onClick="{{ h.onClick }}" style="display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:8px; border:none; background:{{ h.bg }}; cursor:pointer; text-align:left;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;"><path d="M21 11.5a8.5 8.5 0 01-12.5 7.5L3 20l1-5.4A8.5 8.5 0 1121 11.5z" stroke="#B4B8C4" stroke-width="1.8" stroke-linejoin="round"/></svg>
                    <span style="font-size:12.5px; font-weight:500; color:#3C4258; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ h.title }}</span>
                  </button>
                </sc-for>
              </sc-if>
              <sc-if value="{{ hasNoHistory }}" hint-placeholder-val="{{ true }}">
                <div style="font-size:12px; color:#B4B8C4; padding:4px 8px; line-height:1.6;">No past chats yet.</div>
              </sc-if>
            </div>
          </sc-if>
        </div>

      </div>
    </div>
  </aside>

  <!-- Main -->
  <main style="flex:1; display:flex; flex-direction:column; min-width:0; height:100vh;">
    <header style="display:flex; align-items:center; justify-content:space-between; padding:16px 28px;">
      <div style="display:flex; align-items:center; gap:14px;">
        <button onClick="{{ onToggleSidebar }}" style="width:26px; height:26px; border:none; background:transparent; color:#9297A6; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="transform:{{ toggleRotate }}; transition:transform .18s ease;"><path d="M11 6l6 6-6 6M5 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <button style="width:28px; height:28px; border-radius:8px; border:none; background:transparent; color:#9297A6; display:flex; align-items:center; justify-content:center; cursor:pointer;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
      </div>
    </header>

    <div style="flex:1; overflow-y:auto; padding:0 28px 28px; display:flex; flex-direction:column; align-items:center;">
      <div style="width:100%; max-width:640px; display:flex; flex-direction:column; gap:22px; padding-top:{{ topPad }};">

        <sc-if value="{{ hasNoMessages }}" hint-placeholder-val="{{ true }}">
          <div style="text-align:center; animation:fadeUp .4s ease both;">
            <h1 style="font-family:'Manrope',sans-serif; font-size:26px; font-weight:700; letter-spacing:-0.01em; margin:0 0 8px; color:#171B2E;">Ask about your documents</h1>
            <p style="font-size:13.5px; color:#9297A6; margin:0; line-height:1.6;">Upload a PDF, then ask a question to get a grounded, cited answer.</p>
          </div>
        </sc-if>

        <div style="width:100%; display:flex; align-items:flex-end; gap:8px; padding:6px 6px 6px 10px; background:#F5F6FA; border-radius:14px;">
          <input type="file" accept="application/pdf" multiple style="display:none;" id="composerFileInput" onChange="{{ onFileSelect }}"/>
          <button onClick="{{ onPickFile }}" style="width:32px; height:32px; border-radius:9px; border:none; background:transparent; color:#6B7280; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <textarea placeholder="Message Doc Assist…" value="{{ inputValue }}" onChange="{{ onInputChange }}" onKeyDown="{{ onKeyDown }}" rows="1" style="flex:1; border:none; outline:none; resize:none; font-family:'IBM Plex Sans',sans-serif; font-size:14px; color:#1A2036; padding:9px 0; background:transparent; max-height:120px;"></textarea>
          <button onClick="{{ onSend }}" disabled="{{ sendDisabled }}" style="width:32px; height:32px; border-radius:9px; border:none; background:{{ sendBg }}; color:#fff; display:flex; align-items:center; justify-content:center; cursor:{{ sendCursor }}; flex-shrink:0; transition:background .15s ease;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <sc-if value="{{ hasNoMessages }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
            <sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="3">
              <button onClick="{{ s.onClick }}" style="padding:7px 13px; border-radius:999px; border:1px solid #EEEFF3; background:#fff; color:#6B7280; font-family:'IBM Plex Sans',sans-serif; font-size:12px; font-weight:500; cursor:pointer;">{{ s.label }}</button>
            </sc-for>
          </div>
        </sc-if>

        <sc-for list="{{ messages }}" as="m" hint-placeholder-count="0">
          <div style="display:flex; flex-direction:column; gap:6px; align-items:{{ m.align }}; animation:fadeUp .3s ease both;">
            <div style="max-width:84%; padding:11px 15px; border-radius:14px; font-size:14px; line-height:1.6; background:{{ m.bg }}; color:{{ m.color }}; border:{{ m.border }};">
              {{ m.text }}
            </div>
            <sc-if value="{{ m.hasCitation }}">
              <div style="font-size:11px; color:#B4B8C4; padding:0 4px;">{{ m.citation }}</div>
            </sc-if>
          </div>
        </sc-for>

        <sc-if value="{{ isThinking }}">
          <div style="font-size:12.5px; color:#B4B8C4; padding:2px 4px;">Thinking…</div>
        </sc-if>

      </div>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    sidebarOpen: true,
    historySectionOpen: true,
    librarySectionOpen: true,
    pendingFiles: [],
    docs: [],
    isIngesting: false,
    messages: [],
    history: [],
    inputValue: '',
    isThinking: false,
  };

  onToggleSidebar = () => this.setState(s => ({ sidebarOpen: !s.sidebarOpen }));
  onToggleHistorySection = () => this.setState(s => ({ historySectionOpen: !s.historySectionOpen }));
  onToggleLibrarySection = () => this.setState(s => ({ librarySectionOpen: !s.librarySectionOpen }));

  onSelectHistory = (id) => this.setState({ activeHistoryId: id });

  onPickFile = () => {
    const el = document.getElementById('composerFileInput');
    if (el) el.click();
  };

  onFileSelect = (e) => {
    const files = Array.from(e.target.files || []).map(f => ({ name: f.name }));
    if (!files.length) return;
    this.setState({ isIngesting: true });
    setTimeout(() => {
      this.setState(s => ({
        isIngesting: false,
        docs: [...s.docs, ...files],
        librarySectionOpen: true,
      }));
    }, 1200);
  };

  onInputChange = (e) => this.setState({ inputValue: e.target.value });

  onKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      this.onSend();
    }
  };

  sendQuestion = (text) => {
    if (!text.trim() || this.state.isThinking) return;
    const userMsg = { align: 'flex-end', bg: '#171B2E', color: '#fff', border: 'none', text, hasCitation: false };
    const isFirst = this.state.messages.length === 0;
    this.setState(s => ({
      messages: [...s.messages, userMsg],
      inputValue: '',
      isThinking: true,
      history: isFirst ? [{ title: text.slice(0, 40) }, ...s.history] : s.history,
    }));
    setTimeout(() => {
      const hasDocs = this.state.docs.length > 0;
      const reply = hasDocs
        ? { align: 'flex-start', bg: '#F5F6FA', color: '#1A2036', border: 'none', text: `Based on "${this.state.docs[0].name}", here's what I found: the policy outlines the relevant steps and approval chain.`, hasCitation: true, citation: `${this.state.docs[0].name} · p. 4` }
        : { align: 'flex-start', bg: '#F5F6FA', color: '#1A2036', border: 'none', text: 'Upload a PDF first so I can ground my answer in your documents.', hasCitation: false };
      this.setState(s => ({ messages: [...s.messages, reply], isThinking: false }));
    }, 1100);
  };

  onSend = () => this.sendQuestion(this.state.inputValue);

  renderVals() {
    const hasPending = this.state.pendingFiles.length > 0;
    const hasDocs = this.state.docs.length > 0;
    const hasHistory = this.state.history.length > 0;

    return {
      sidebarWidth: this.state.sidebarOpen ? '264px' : '0px',
      toggleRotate: this.state.sidebarOpen ? 'rotate(180deg)' : 'rotate(0deg)',
      onToggleSidebar: this.onToggleSidebar,
      historySectionOpen: this.state.historySectionOpen,
      historyChevron: this.state.historySectionOpen ? 'rotate(0deg)' : 'rotate(-90deg)',
      onToggleHistorySection: this.onToggleHistorySection,
      librarySectionOpen: this.state.librarySectionOpen,
      libraryChevron: this.state.librarySectionOpen ? 'rotate(0deg)' : 'rotate(-90deg)',
      onToggleLibrarySection: this.onToggleLibrarySection,
      hasHistory, hasNoHistory: !hasHistory,
      history: this.state.history.map(h => ({ title: h.title, bg: 'transparent', onClick: () => {} })),
      onFileSelect: this.onFileSelect,
      onPickFile: this.onPickFile,
      isIngesting: this.state.isIngesting,
      hasDocs, hasNoDocs: !hasDocs,
      docs: this.state.docs,
      hasNoMessages: this.state.messages.length === 0,
      topPad: this.state.messages.length === 0 ? '28vh' : '32px',
      messages: this.state.messages,
      isThinking: this.state.isThinking,
      suggestions: [
        { label: 'Summarize the onboarding guide', onClick: () => this.sendQuestion('Summarize the onboarding guide') },
        { label: "What's the PTO policy?", onClick: () => this.sendQuestion("What's the PTO policy?") },
        { label: 'List required SOP approvals', onClick: () => this.sendQuestion('List required SOP approvals') },
      ],
      inputValue: this.state.inputValue,
      onInputChange: this.onInputChange,
      onKeyDown: this.onKeyDown,
      sendDisabled: !this.state.inputValue.trim() || this.state.isThinking,
      sendBg: (!this.state.inputValue.trim() || this.state.isThinking) ? '#D6DAE3' : '#171B2E',
      sendCursor: (!this.state.inputValue.trim() || this.state.isThinking) ? 'not-allowed' : 'pointer',
      onSend: this.onSend,
    };
  }
}
</script>
</body>
</html>
